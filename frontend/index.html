<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>FlyPrecise</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <meta name="theme-color" content="#0b0d10" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <a class="brand" href="index.html">Fly<span>Precise</span></a>
      <nav class="tabs">
        <a href="index.html" class="on">NOW</a>
        <a href="past.html">PAST FLIGHTS</a>
        <a href="analytics.html">ANALYTICS</a>
      </nav>
      <a class="gear" href="settings.html" title="Settings">&#9881;</a>
    </header>
    <main>
      <iframe class="live" src="live.html" title="Live readings"></iframe>
      <form class="load" method="post" action="/start">
        <h2>Load a flight</h2>
        <div class="grid">
          <label>
            Flight
            <input
              name="flight"
              type="text"
              maxlength="10"
              placeholder="XX1234"
              autocomplete="off"
              required
              value="XX1234"
            />
          </label>
          <label>
            Aircraft
            <input
              name="acft"
              type="text"
              maxlength="14"
              placeholder="B787-900"
              autocomplete="off"
              value="B787-900"
            />
          </label>
          <label>
            From
            <input name="from" type="text" maxlength="4" placeholder="LAX" autocomplete="off" value="LAX" />
          </label>
          <label>
            To
            <input name="to" type="text" maxlength="4" placeholder="SIN" autocomplete="off" value="SIN" />
          </label>
        </div>
        <label class="fuel">
          Fuel requested (lbs)
          <input
            name="fuel"
            type="number"
            inputmode="decimal"
            min="0.1"
            max="110"
            step="0.1"
            placeholder="0.0"
            required
            value="6.6"
          />
        </label>
        <button class="btn start" type="submit">START FUELLING</button>
      </form>
      <form method="post" action="/stop"><button class="btn stop" type="submit">STOP</button></form>
      <p class="hint">
        Readings refresh every second. Rig limit 50 kg per fill.
        <a href="advanced.html">Advanced</a>
      </p>
    </main>
  </body>
</html>
