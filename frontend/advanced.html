<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>FlyPrecise</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <meta name="theme-color" content="#0b0d10" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <a class="brand" href="index.html">Fly<span>Precise</span></a>
      <nav class="tabs">
        <a href="index.html">NOW</a>
        <a href="past.html">PAST FLIGHTS</a>
        <a href="analytics.html">ANALYTICS</a>
      </nav>
      <a class="gear" href="settings.html" title="Settings">&#9881;</a>
    </header>
    <main>
      <h1>Advanced</h1>
      <div class="banner err">
        Manual valve and pump control. Toggling anything here cancels the automatic sequence on the Uno.
        Running the pump with both valves closed dead-heads it.
      </div>
      <div class="adv">
        <form method="post" action="/advanced">
          <input type="hidden" name="cmd" value="P" />
          <button class="btn adv-btn" type="submit">
            <span>Pump</span>
            <b class="state on">ON</b>
          </button>
        </form>
        <form method="post" action="/advanced">
          <input type="hidden" name="cmd" value="B" />
          <button class="btn adv-btn" type="submit">
            <span>Bypass valve</span>
            <b class="state">OFF</b>
          </button>
        </form>
        <form method="post" action="/advanced">
          <input type="hidden" name="cmd" value="M" />
          <button class="btn adv-btn" type="submit">
            <span>Mainline valve</span>
            <b class="state on">ON</b>
          </button>
        </form>
      </div>
      <form method="post" action="/stop"><button class="btn stop" type="submit">STOP ALL</button></form>
      <p class="hint">
        Last Uno event:
        <code>$E,START,2994</code>
        &nbsp;
        <a href="/debug">debug</a>
        &nbsp;
        <a href="index.html">back</a>
      </p>
    </main>
  </body>
</html>
