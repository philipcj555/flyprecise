<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta http-equiv="refresh" content="1" />
    <title>FlyPrecise</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="live">
    <div class="banner warn">
      Clock not set.
      <a href="settings.html" target="_top">Set it</a>
      so records get a date.
    </div>
    <div class="flight">
      <b>XX1234</b>
      <span class="route">
        LAX
        <i>&rarr;</i>
        SIN
      </span>
      <span class="acft">B787-900</span>
    </div>
    <div class="status">
      <span class="pill p-run">FUELLING</span>
      <span class="dots">
        <span class="dot on">
          <i></i>
          Pump
        </span>
        <span class="dot">
          <i></i>
          Bypass
        </span>
        <span class="dot on">
          <i></i>
          Main
        </span>
      </span>
    </div>
    <div class="readouts">
      <div class="ro">
        <span class="lbl">Fuel requested</span>
        <span class="num">
          245,850
          <small>lbs</small>
        </span>
      </div>
      <div class="ro">
        <span class="lbl">Live density</span>
        <span class="num">
          6.91
          <small>lbs/gallon</small>
        </span>
      </div>
      <div class="ro big">
        <span class="lbl">Gallons loaded</span>
        <span class="num">
          35,578
          <small>gallons</small>
        </span>
      </div>
      <div class="ro diff">
        <span class="lbl">FlyPrecise difference</span>
        <span class="num">
          -7,712
          <small>lbs</small>
        </span>
      </div>
    </div>
    <div class="target">
      <span>245,844 lbs loaded</span>
      <span>99%</span>
    </div>
    <div class="bar"><div style="width: 99%"></div></div>
  </body>
</html>
