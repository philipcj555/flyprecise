; FlyPrecise ESP32 dashboard
; Board: ESP32-S3-DevKitM-1 (carries ESP32-S3-MINI-1-N8, 8 MB flash, no PSRAM)
;
;   pio run -e devkit            build with the real Uno link
;   pio run -e fake              build with FAKE_UNO simulator (no rig needed)
;   pio run -e fake -t upload    flash
;   pio device monitor -e fake   debug log over native USB
;
; No filesystem upload is needed: style.css / manifest.json / icon.svg are
; embedded into the firmware at build time. LittleFS is formatted on first
; boot and only holds sessions.csv + settings.json.

[platformio]
default_envs = devkit

[env]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = default_8MB.csv   ; 1.5 MB "spiffs" region, used by LittleFS
board_upload.flash_size = 8MB
board_build.embed_txtfiles =
    data/style.css
    data/manifest.json
    data/icon.svg
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    -Wall
lib_deps =
    bblanchon/ArduinoJson@^7.1.0

[env:devkit]
build_flags = ${env.build_flags} -DFAKE_UNO=0

[env:fake]
build_flags = ${env.build_flags} -DFAKE_UNO=1
